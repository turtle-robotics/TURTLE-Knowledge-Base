name: New Knowledge Base Content
description: Request a new page or topic for the Knowledge Base.
title: "[Content]: "
labels:
  - "content:new"
body:
  - type: textarea
    id: topic
    attributes:
      label: Topic
      description: What topic should the Knowledge Base cover?
      placeholder: "Example: How to choose a battery for a robot."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why should this be in the Knowledge Base?
      description: Explain who needs this content and how it helps.
    validations:
      required: true
  - type: textarea
    id: contents
    attributes:
      label: Suggested content
      description: List any points the page should cover.
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: Suggested location
      description: Name the folder or page under docs/source/ where the page should live.
      placeholder: "Example: Electronics_and_Power"
    validations:
      required: false
  - type: dropdown
    id: level
    attributes:
      label: Intended level
      options:
        - Beginner
        - Intermediate
        - Advanced
        - Mixed
    validations:
      required: false
