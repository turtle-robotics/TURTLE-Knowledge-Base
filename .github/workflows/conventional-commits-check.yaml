name: PR Conventional Commit Validation

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      type: ${{ steps.lint.outputs.type }}

    steps:
      - name: Validate Conventional Commit title
        id: lint
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            ci
            refactor
            perf
            chore
            revert
            build

  label-pr:
    name: Label PR
    needs: validate-pr-title
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Apply PR type label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TYPE: ${{ needs.validate-pr-title.outputs.type }}
        run: |
          case "$PR_TYPE" in
            feat)     LABEL="feature" ;;
            fix)      LABEL="fix" ;;
            docs)     LABEL="documentation" ;;
            test)     LABEL="test" ;;
            ci)       LABEL="CI/CD" ;;
            refactor) LABEL="refactor" ;;
            perf)     LABEL="performance" ;;
            chore)    LABEL="chore" ;;
            revert)   LABEL="revert" ;;
            build)    LABEL="build" ;;
            *) exit 0 ;;
          esac

          TYPE_LABELS=(
            "feature"
            "fix"
            "documentation"
            "test"
            "CI/CD"
            "refactor"
            "performance"
            "chore"
            "revert"
            "build"
          )

          for old_label in "${TYPE_LABELS[@]}"; do
            if [ "$old_label" != "$LABEL" ]; then
              gh pr edit "$PR_NUMBER" \
                --remove-label "$old_label" 2>/dev/null || true
            fi
          done

          gh pr edit "$PR_NUMBER" --add-label "$LABEL"
