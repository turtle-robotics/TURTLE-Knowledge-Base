  label-pr:
    name: Label PR
    needs: validate-pr-title
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Apply PR type label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TYPE: ${{ needs.validate-pr-title.outputs.type }}
        run: |
          case "$PR_TYPE" in
            feat)     LABEL="feature" ;;
            fix)      LABEL="fix" ;;
            docs)     LABEL="documentation" ;;
            test)     LABEL="test" ;;
            ci)       LABEL="CI/CD" ;;
            refactor) LABEL="refactor" ;;
            perf)     LABEL="performance" ;;
            chore)    LABEL="chore" ;;
            revert)   LABEL="revert" ;;
            build)    LABEL="build" ;;
            *) exit 0 ;;
          esac

          # Remove any previous PR-type label.
          for old_label in \
            feature fix documentation test "CI/CD" \
            refactor performance chore revert build
          do
            if [ "$old_label" != "$LABEL" ]; then
              gh issue edit "$PR_NUMBER" \
                --remove-label "$old_label" 2>/dev/null || true
            fi
          done

          gh issue edit "$PR_NUMBER" --add-label "$LABEL"
